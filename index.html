<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>COMMAND</title>
<style>
:root{color-scheme:dark;--bg:#0a0a16;--cy:#00f0ff;--mg:#ff2bd6;--gr:#39ff88}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:#d8f8ff;font-family:"Courier New","Noto Sans JP",monospace;overflow:hidden}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:10}
#reticle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--cy);font-size:32px;text-shadow:0 0 8px var(--cy)}
#hpbox{position:absolute;left:20px;bottom:20px;width:260px}
#hpbar{height:16px;border:1px solid var(--cy);box-shadow:0 0 10px var(--cy);margin-top:4px}
#hpfill{height:100%;width:100%;background:linear-gradient(90deg,var(--mg),var(--cy));transition:width .15s}
#stat{position:absolute;right:20px;bottom:20px;text-align:right;text-shadow:0 0 8px var(--cy);font-size:20px;line-height:1.5}
#obj{color:var(--gr);font-size:16px}
#flash{position:absolute;inset:0;background:radial-gradient(transparent 40%,rgba(255,43,214,.6));opacity:0;transition:opacity .3s}
#screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,22,.88);text-align:center;gap:14px;z-index:20}
h1{font-size:clamp(30px,8vw,76px);margin:0;letter-spacing:.12em;color:var(--cy);text-shadow:0 0 20px var(--cy),4px 0 var(--mg)}
#msg{font-size:18px;white-space:pre-line;line-height:1.7;max-width:92vw}
button{font:inherit;font-size:20px;padding:10px 34px;color:var(--cy);background:transparent;border:2px solid var(--cy);box-shadow:0 0 14px var(--cy);cursor:pointer;letter-spacing:.15em}
button:hover{background:var(--cy);color:var(--bg)}
#term{font-size:clamp(12px,2.4vw,18px);color:var(--gr);text-shadow:0 0 8px var(--gr);text-align:left;white-space:pre;min-height:9em;border:1px solid var(--gr);padding:14px 18px;background:rgba(0,20,10,.6);max-width:92vw;overflow:hidden}
#roll{display:none;height:30vh;width:min(520px,90vw);overflow:hidden}
#rollin{white-space:pre-line;line-height:2;color:var(--gr);animation:rl 18s linear infinite}
@keyframes rl{from{transform:translateY(30vh)}to{transform:translateY(-100%)}}
#siren{position:fixed;inset:0;pointer-events:none;z-index:11;display:none;box-shadow:inset 0 0 130px 30px rgba(255,0,40,.75);animation:sr .7s steps(1) infinite}
@keyframes sr{0%{opacity:1}50%{opacity:.15}}
body.red #siren{display:block}
#wname{font-size:18px;letter-spacing:.06em;text-shadow:0 0 8px currentColor}
#cdbar{height:8px;width:230px;margin:4px 0 8px auto;border:1px solid rgba(255,255,255,.35)}
#cdfill{height:100%;width:100%;background:#00f0ff}
#heal{position:absolute;inset:0;background:radial-gradient(transparent 45%,rgba(57,255,136,.65));opacity:0;transition:opacity .35s}
#snd{position:fixed;top:10px;right:10px;z-index:30;font-size:13px;padding:4px 12px;letter-spacing:.08em;box-shadow:0 0 8px var(--cy);background:rgba(10,10,22,.7)}
#screen{overflow:auto;padding:18px 0;justify-content:safe center}
#settings{display:none;width:min(520px,92vw);border:1px solid var(--cy);padding:10px 16px;background:rgba(0,20,30,.7);box-shadow:0 0 12px rgba(0,240,255,.35);text-align:left}
#settings .st{color:var(--mg);letter-spacing:.25em;font-size:13px;margin-bottom:6px;text-align:center}
#settings label{display:grid;grid-template-columns:160px 1fr 54px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
#settings input[type=range]{width:100%;accent-color:#00f0ff}
#settings span{text-align:right;color:var(--gr)}
#cp{position:fixed;top:46px;right:10px;z-index:31;color:#39ff88;text-shadow:0 0 10px #39ff88;border:1px solid #39ff88;padding:4px 10px;font-size:13px;letter-spacing:.1em;background:rgba(0,20,10,.75);box-shadow:0 0 10px rgba(57,255,136,.5);opacity:0;transition:opacity .4s;pointer-events:none}
html,body{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#screen,#settings{touch-action:pan-y}
#settings input[type=range]{touch-action:none}
#settings button{font-size:12px;padding:4px 10px;letter-spacing:.05em;justify-self:start}
#touch{display:none;position:fixed;inset:0;z-index:12;pointer-events:none;touch-action:none;user-select:none;-webkit-user-select:none}
#touch *{touch-action:none;user-select:none;-webkit-user-select:none}
body.tui.play:not(.dlgon) #touch{display:block}
#touch>*{pointer-events:auto}
#tLook{position:absolute;left:50%;top:0;right:0;bottom:0}
#joy{position:absolute;left:0;top:0;bottom:0;width:50%}
#joyBase{position:absolute;left:max(24px,env(safe-area-inset-left));bottom:max(28px,env(safe-area-inset-bottom));width:140px;height:140px;border-radius:50%;border:2px solid var(--cy);background:rgba(0,240,255,.08);box-shadow:0 0 14px rgba(0,240,255,.5),inset 0 0 18px rgba(0,240,255,.2);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:62px;height:62px;border-radius:50%;border:2px solid var(--cy);background:rgba(0,240,255,.35);transform:translate(-50%,-50%);box-shadow:0 0 12px var(--cy)}
#tFire,#tWeap,#tPause{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;letter-spacing:.08em;background:rgba(255,43,214,.18);border:2px solid var(--mg);box-shadow:0 0 14px var(--mg),inset 0 0 14px rgba(255,43,214,.3);text-shadow:0 0 8px var(--mg)}
#tFire{right:max(26px,env(safe-area-inset-right));bottom:max(34px,env(safe-area-inset-bottom));width:110px;height:110px;font-size:20px;background:rgba(255,43,214,.3)}
#tWeap{right:max(150px,calc(env(safe-area-inset-right) + 130px));bottom:max(76px,calc(env(safe-area-inset-bottom) + 50px));width:70px;height:70px;font-size:11px;border-color:var(--cy);box-shadow:0 0 12px var(--cy);background:rgba(0,240,255,.15);text-shadow:0 0 8px var(--cy)}
#tPause{left:12px;top:12px;width:44px;height:44px;font-size:14px;border-color:var(--cy);box-shadow:0 0 10px var(--cy);border-radius:10px}
body.fire #tFire{background:rgba(255,43,214,.7)}
body.tui #hpbox{left:180px;bottom:14px;width:150px}
body.tui #stat{bottom:auto;top:84px;right:10px;font-size:15px}
#rt{position:relative;display:inline-block}
#reticle.lock{color:#ff3b30;text-shadow:0 0 12px #ff3b30}
#reticle.lock #rt{animation:lk 1s linear infinite}
#reticle.lock #rt::before{content:'';position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border:2px dashed #ff3b30;border-radius:50%}
#reticle.lock::after{content:'LOCK-ON';position:absolute;left:50%;top:46px;transform:translateX(-50%);font-size:10px;letter-spacing:.25em;white-space:nowrap;color:#ff3b30;text-shadow:0 0 8px #ff3b30}
@keyframes lk{from{transform:rotate(0) scale(.8)}to{transform:rotate(360deg) scale(.8)}}
#danger{position:fixed;inset:0;pointer-events:none;z-index:11;display:none;box-shadow:inset 0 0 90px 10px rgba(255,20,40,.85);animation:dg .9s ease-in-out infinite}
@keyframes dg{0%,100%{opacity:.25}15%{opacity:1}30%{opacity:.4}45%{opacity:.95}60%{opacity:.25}}
#dangerTxt{position:fixed;left:50%;bottom:22%;transform:translateX(-50%);z-index:11;display:none;color:#ff3b30;font-size:14px;letter-spacing:.2em;text-shadow:0 0 10px #ff3b30;animation:dgt .6s steps(1) infinite;pointer-events:none;white-space:nowrap}
@keyframes dgt{0%{opacity:1}50%{opacity:.35}}
body.danger.play #danger,body.danger.play #dangerTxt{display:block}
#victory{position:fixed;left:0;right:0;top:36%;text-align:center;z-index:26;pointer-events:none;opacity:0}
#victory::before{content:'';position:absolute;left:0;right:0;top:50%;height:110px;margin-top:-55px;background:linear-gradient(90deg,transparent,rgba(0,240,255,.55),rgba(255,212,0,.6),rgba(0,240,255,.55),transparent);transform:scaleX(0)}
#victory.on{animation:vic 3.6s forwards}
#victory.on::before{animation:vband 3.6s forwards}
#vtxt{position:relative;display:inline-block;font-size:clamp(16px,4.2vw,46px);font-weight:bold;letter-spacing:.1em;color:#fff;text-shadow:3px 0 #ff2bd6,-3px 0 #00f0ff,0 0 24px #ffd400}
#victory.on #vtxt{animation:vj .22s steps(2) 8,vz 3.6s forwards}
@keyframes vic{0%{opacity:0}6%{opacity:1}85%{opacity:1}100%{opacity:0}}
@keyframes vband{0%{transform:scaleX(0)}15%{transform:scaleX(1)}85%{transform:scaleX(1)}100%{transform:scaleX(1.2);opacity:0}}
@keyframes vj{0%{transform:translate(0,0) skewX(0)}25%{transform:translate(-8px,2px) skewX(10deg)}50%{transform:translate(7px,-2px) skewX(-8deg)}75%{transform:translate(-3px,1px) skewX(4deg)}100%{transform:translate(0,0)}}
@keyframes vz{0%{scale:.5}12%{scale:1.25}30%{scale:1}100%{scale:1.04}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:24}
#white{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5;transition:opacity 1.6s}
#comms{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:min(680px,92vw);padding:10px 16px;border:1px solid var(--mg);background:rgba(10,0,20,.72);box-shadow:0 0 14px var(--mg);opacity:0;transition:opacity .5s}
#commsHead{font-size:12px;color:var(--mg);letter-spacing:.2em;margin-bottom:6px}
#commsTxt{font-size:clamp(14px,2.6vw,19px);color:var(--gr);text-shadow:0 0 6px var(--gr);min-height:1.4em}
#timer{display:none;position:absolute;top:125px;left:50%;transform:translateX(-50%);color:#ff2040;text-shadow:0 0 10px #ff2040;font-size:16px;letter-spacing:.1em;white-space:pre}
#bossbar{display:none;position:absolute;top:125px;left:50%;transform:translateX(-50%);width:min(520px,80vw);height:14px;border:1px solid var(--mg);box-shadow:0 0 10px var(--mg)}
#bossfill{height:100%;width:100%;background:var(--mg)}
#sys{position:fixed;left:0;right:0;top:34%;text-align:center;z-index:15;font-size:clamp(18px,4.5vw,42px);letter-spacing:.15em;color:#fff;opacity:0;pointer-events:none;text-shadow:3px 0 var(--mg),-3px 0 var(--cy)}
#sys.on{animation:sysa 1.8s steps(1) forwards}
@keyframes sysa{0%,100%{opacity:0}5%{opacity:1;transform:translateX(-14px) skewX(10deg)}10%{transform:translateX(16px)}15%{transform:none}30%{transform:translateX(-7px)}35%{transform:none}80%{opacity:1}95%{opacity:0}}
#noise{position:fixed;inset:0;pointer-events:none;z-index:12;opacity:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.14) 0 2px,transparent 2px 5px)}
body.g #noise{animation:nz .9s steps(1)}
@keyframes nz{0%,40%,70%{opacity:1}20%,55%,100%{opacity:0}}
body.g canvas{animation:gl .9s steps(1)}
@keyframes gl{0%{transform:translate(8px,0);filter:hue-rotate(90deg) saturate(3)}15%{transform:translate(-10px,3px) skewX(4deg);filter:invert(.8)}30%{transform:translate(6px,-4px);filter:hue-rotate(200deg)}45%{transform:none;filter:none}60%{transform:translate(-5px,0);filter:contrast(2) hue-rotate(40deg)}80%{transform:skewX(-3deg)}100%{transform:none;filter:none}}
#dlg{display:none;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(900px,96vw);z-index:14;padding:14px 18px;background:linear-gradient(180deg,rgba(0,20,30,.92),rgba(10,0,25,.92));border:1px solid var(--cy);box-shadow:0 0 18px var(--cy),inset 0 0 20px rgba(0,240,255,.15);clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));display:none;gap:14px}
#dlg.on{display:flex}
#face{flex:0 0 74px;height:74px;border:1px solid var(--mg);background:radial-gradient(circle at 50% 38%,#ff9af0 0 14px,transparent 15px),radial-gradient(ellipse at 50% 105%,var(--mg) 0 30px,transparent 31px),#12001c;box-shadow:0 0 10px var(--mg)}
#dbody{flex:1;min-width:0}
#dname{color:var(--mg);letter-spacing:.3em;font-size:13px;margin-bottom:4px}
#dtxt{min-height:3.4em;font-size:clamp(14px,2.4vw,18px);line-height:1.7;color:#d8fbff}
#dact{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
#dact button{font-size:15px;padding:6px 16px}
#dhint{font-size:11px;color:#6aa;align-self:center;margin-right:auto}
</style>
</head>
<body>
<div id="hud">
  <div id="flash"></div><div id="heal"></div>
  <div id="comms"><div id="commsHead">▌ OPERATOR // CHLOE</div><div id="commsTxt"></div></div>
  <div id="timer"></div><div id="bossbar"><div id="bossfill"></div></div>
  <div id="reticle"><span id="rt">+</span></div>
  <div id="hpbox">HP <span id="hptxt">100</span><div id="hpbar"><div id="hpfill"></div></div></div>
  <div id="stat"><div id="wname"></div><div id="cdbar"><div id="cdfill"></div></div>SCORE <span id="score">0</span><br><span id="phlab">PHASE 1/12</span><br><span id="obj"></span></div>
</div>
<div id="dlg"><div id="face"></div><div id="dbody"><div id="dname">CHLOE // OPERATOR</div><div id="dtxt"></div>
  <div id="dact"><span id="dhint">[NEXT] クリック / Space</span><span id="chs"></span><button id="nextb">NEXT ▶</button></div></div></div>
<button id="snd">[SOUND: ON]</button><div id="cp">[SYSTEM] CHECKPOINT SAVED</div><div id="danger"></div><div id="dangerTxt">[! PROXIMITY ALERT !]</div>
<div id="victory"><span id="vtxt">[ SYSTEM LIBERATED // "COMMAND" ACQUIRED ]</span></div>
<canvas id="confetti"></canvas>
<div id="siren"></div><div id="touch">
  <div id="tLook"></div>
  <div id="joy"><div id="joyBase"><div id="knob"></div></div></div>
  <div id="tFire">FIRE</div>
  <div id="tWeap">WEAPON</div>
  <div id="tPause">❚❚</div>
</div>
<div id="sys"></div><div id="noise"></div><div id="white"></div>
<div id="screen">
  <h1 id="title">COMMAND</h1>
  <div id="term"></div>
  <div id="msg"></div>
  <div id="roll"><div id="rollin"></div></div>
  <button id="btn">START</button>
  <button id="btnC" style="display:none"></button>
  <button id="btn2" style="display:none"></button>
  <div id="settings" style="display:block">
    <div class="st">[ SETTINGS ]</div>
    <label>MOUSE SENSITIVITY<input id="sSens" type="range" min="0.2" max="3" step="0.05"><span id="vSens"></span></label>
    <label>FOV<input id="sFov" type="range" min="60" max="110" step="1"><span id="vFov"></span></label>
    <label>BGM VOLUME<input id="sBgm" type="range" min="0" max="100" step="1"><span id="vBgm"></span></label>
    <label>SE VOLUME<input id="sSe" type="range" min="0" max="100" step="1"><span id="vSe"></span></label>
    <label>TOUCH CONTROLS<button id="sTui"></button><span></span></label>
    <label>AIM ASSIST<button id="sAim"></button><span></span></label>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
<script>
/* ===== SOUND SETTINGS (edit here) ===== */
const BGM_URL = "command(bgm).mp3";   // URL or path of your BGM file (mp3/ogg/wav). Missing file = just a console warning
const CLEAR_BGM_URL = "command(clear-bgm).mp3"; // BGM for the ending (mission accomplished) screen. Missing file = skipped safely
const BGM_VOLUME = 0.4;      // BGM volume 0..1
const SE_VOLUME = 0.8;       // sound-effect master volume 0..1
(function(){
if(window.__cmdBound)return;window.__cmdBound=true;
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0a0a16);
scene.fog=new THREE.Fog(0x0a0a16,15,120);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,300);
// holder = yaw/pitch owned by PointerLockControls (mouse only); camera = child that receives recoil only
const holder=new THREE.Object3D();holder.rotation.order='YXZ';scene.add(holder);holder.add(camera);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
const grid=new THREE.GridHelper(400,200,0xff2bd6,0x00f0ff);
grid.material.transparent=true;grid.material.opacity=.4;scene.add(grid);

// ---------- city: 3 areas split by two energy gates (AABB on X/Z + roof height) ----------
const cv=document.createElement('canvas');cv.width=64;cv.height=128;
{const g=cv.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,64,128);
 for(let y=0;y<32;y++)for(let x=0;x<8;x++)if(Math.random()<.4){g.fillStyle=Math.random()<.5?'#fff':'#888';g.fillRect(x*8+2,y*4+1,4,2);}}
const baseTex=new THREE.CanvasTexture(cv);
const NEON=[0x00f0ff,0xff2bd6,0x39ff88],NC=['#00f0ff','#ff2bd6','#39ff88'],pick=()=>NEON[Math.floor(Math.random()*3)];
const boxes=[],bMats=[],eMats=[],signs=[],COVERS={1:[],2:[],3:[]};
function addBuilding(x0,x1,z0,z1,h,col,collide,hb){
  hb=hb||0;const w=x1-x0,d=z1-z0;
  const t=baseTex.clone();t.needsUpdate=true;t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(Math.max(1,Math.round(w/6)),Math.max(1,Math.round(h/8)));
  const m=new THREE.MeshBasicMaterial({map:t,color:col});
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  mesh.position.set((x0+x1)/2,hb+h/2,(z0+z1)/2);scene.add(mesh);
  const em=new THREE.LineBasicMaterial({color:col});
  const ed=new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry),em);
  ed.position.copy(mesh.position);scene.add(ed);
  bMats.push({m,c:col});eMats.push({m:em,c:col});
  const b={x0,x1,z0,z1,h:hb+h,mesh,ed};
  if(collide)boxes.push(b);return b;
}
const addCol=b=>{if(!boxes.includes(b))boxes.push(b);},delCol=b=>{const i=boxes.indexOf(b);if(i>=0)boxes.splice(i,1);};
function addSign(txt,x,y,z,ry,w,ci){
  const mk=col=>{
    const c=document.createElement('canvas');c.width=512;c.height=128;const g=c.getContext('2d');
    g.fillStyle='rgba(0,0,0,.88)';g.fillRect(0,0,512,128);
    g.strokeStyle=col;g.lineWidth=6;g.shadowColor=col;g.shadowBlur=18;g.strokeRect(6,6,500,116);
    g.fillStyle=col;g.font='bold 76px "Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif';g.textAlign='center';g.textBaseline='middle';
    g.fillText(txt,256,68,470);g.fillText(txt,256,68,470);return new THREE.CanvasTexture(c);
  };
  const tex=mk(NC[ci%3]),texR=mk('#ff2040');   // normal + red-alert versions
  const m=new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide});
  const s=new THREE.Mesh(new THREE.PlaneGeometry(w,w/4),m);s.position.set(x,y,z);s.rotation.y=ry;scene.add(s);
  signs.push({m,tex,texR,off:0});
}
const P2=Math.PI/2,SIGNS=['電脳','ネオ・トキオ','警告','サイバー','コマンド','接続','即死'];
// Area 1 z>0 (slum) | Gate A z=0 | Area 2 -70<z<0 (commercial) | Gate B z=-70 | Area 3 z<-70 (core dome)
const AREAS={1:{z0:4,z1:62},2:{z0:-66,z1:-4},3:{z0:-136,z1:-74}};
const areaOf=z=>z>0?1:z>-70?2:3;
// outer walls
addBuilding(-46,-40,-146,70,60,pick(),true);addBuilding(40,46,-146,70,60,pick(),true);
addBuilding(-46,46,64,70,60,pick(),true);addBuilding(-46,46,-146,-140,70,pick(),true);
addSign('ネオ・トキオ',0,26,63.95,Math.PI,30,1);addSign('電脳',-39.95,12,30,P2,10,0);addSign('接続',39.95,12,40,-P2,10,2);
addSign('警告',-39.95,16,-25,P2,10,1);addSign('即死',39.95,16,-45,-P2,10,0);
addSign('コマンド',0,30,-139.95,0,36,2);addSign('電脳',-39.95,14,-100,P2,12,0);addSign('サイバー',39.95,14,-110,-P2,12,1);
// scatter cover buildings in an area (kept apart so there are lanes to fight and hide in)
function scatter(area,z0,z1,n,hMin,hMax,wMin,wMax,signChance,avoid){
  const placed=[];
  for(let t=0;t<n*40&&placed.length<n;t++){
    const w=rnd(wMin,wMax),d=rnd(wMin,wMax),cx=rnd(-33,33),cz=rnd(z0+d/2,z1-d/2);
    if(avoid&&avoid(cx,cz))continue;

    const cx=Math.max(b.x0,Math.min(p.x,b.x1)),cz=Math.max(b.z0,Math.min(p.z,b.z1));
    const dx=p.x-cx,dz=p.z-cz,d2=dx*dx+dz*dz;

// ---------- touch controls (multi-touch by touch identifier; mouse fallback for desktop testing) ----------
function bindTouch(el,h){
  let id=null;
  el.addEventListener('touchstart',e=>{
    e.preventDefault();if(id!==null)return;
    const t=e.changedTouches[0];id=t.identifier;h.start(t.clientX,t.clientY);
  },{passive:false});
  el.addEventListener('touchmove',e=>{
    e.preventDefault();
    for(const t of e.changedTouches)if(t.identifier===id)h.move(t.clientX,t.clientY);
  },{passive:false});
  const end=e=>{
    e.preventDefault();
    for(const t of e.changedTouches)if(t.identifier===id){id=null;h.end();}
  };
  el.addEventListener('touchend',end,{passive:false});el.addEventListener('touchcancel',end,{passive:false});
  let md=false;                                              // mouse fallback (capture on window: the document-level mousemove filter stops later phases)
  el.addEventListener('mousedown',e=>{e.preventDefault();e.stopPropagation();md=true;h.start(e.clientX,e.clientY);});
  window.addEventListener('mousemove',e=>{if(md)h.move(e.clientX,e.clientY);},true);
  window.addEventListener('mouseup',()=>{if(md){md=false;h.end();}});
}
(function bindTouchUI(){
  const JR=60,jc={x:0,y:0},knob=$('knob');
  const setStick=(x,y)=>{
    let dx=x-jc.x,dy=y-jc.y;const d=Math.hypot(dx,dy);
    if(d>JR){dx*=JR/d;dy*=JR/d;}
    joy.x=dx/JR;joy.y=dy/JR;
    knob.style.transform='translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px))';
  };
  bindTouch($('joy'),{                                       // left half: virtual joystick -> same movement vector as WASD
    start(x,y){const r=$('joyBase').getBoundingClientRect();jc.x=r.left+r.width/2;jc.y=r.top+r.height/2;setStick(x,y);},
    move:setStick,
    end(){joy.x=joy.y=0;resetKnob();}
  });
  let lx=0,ly=0;
  bindTouch($('tLook'),{                                     // right half: swipe to look (sensitivity + pitch clamp via lookBy)
    start(x,y){lx=x;ly=y;},
    move(x,y){lookBy(x-lx,y-ly,.0045);lx=x;ly=y;},
    end(){}
  });
  bindTouch($('tFire'),{                                     // hold = fire (SMG full-auto via tick)
    start(){if(!playing||dlg)return;held=true;document.body.classList.add('fire');shoot();},
    move(){},
    end(){held=false;document.body.classList.remove('fire');}
  });
  bindTouch($('tWeap'),{start(){if(playing&&!dlg)setWeapon((wi+1)%3);},move(){},end(){}});
  bindTouch($('tPause'),{start(){if(playing&&touchMode&&!dlg)leavePlay();},move(){},end(){}});
  // TOUCH UI: AUTO / ON / OFF
  function applyTouchMode(){
    touchMode=settings.tui==='on'||(settings.tui==='auto'&&('ontouchstart' in window||navigator.maxTouchPoints>0));
    document.body.classList.toggle('tui',touchMode);
    $('sTui').textContent='[TOUCH UI: '+settings.tui.toUpperCase()+']';
  }
  $('sTui').addEventListener('click',e=>{
    e.preventDefault();settings.tui={auto:'on',on:'off',off:'auto'}[settings.tui];store.set(SET_KEY,settings);applyTouchMode();e.currentTarget.blur();
  });
  applyTouchMode();
})();

function startPhase(n){
  if((n===5||n===9)&&!restoring)saveCheckpoint(n);       // autosave when a gate has just opened
  phase=n;active=false;clearEnemies();pk=0;
  const P=PHASES[n-1];applyEnv(P);glitch(P.title);$('timer').style.display='none';updateHUD();
  if(P.choice)event(P.lines,null,P.choice,k=>{route=k;beginPhase();});
  else event(P.lines,beginPhase);
}
function beginPhase(){
  const P=cur();
  active=true;phaseT=0;lonely=0;spawnT=0;fl={};waiting=!!P.enter&&areaOf(holder.position.z)!==P.enter;
  if(P.tp){holder.position.x=P.tp[0];holder.position.z=P.tp[1];}   // position only, rotation untouched
  (P.start||[]).forEach(f=>FX[f]());
  if(P.heal)hp=Math.min(100,hp+P.heal);
  (P.init||[]).forEach(([k,c])=>{for(let i=0;i<c;i++)spawn(k,true);});
  if(P.goal.type==='survive'){tm=tmMax=P.goal.t;$('timer').style.display='block';}
  if(P.say)say(P.say);
  if(waiting)say('クロエ：「開いたゲートから、奥のエリア '+P.enter+' へ進んで！」');
  updateHUD();
}
function completePhase(){
  if(!active)return;
  active=false;const P=cur();if(phase>=PHASES.length)boomEnemies();clearEnemies();$('timer').style.display='none';
  (P.clear||[]).forEach(f=>FX[f]());
  if(phase>=PHASES.length){clearGame();return;}
  if(P.outroLines){later(()=>event(P.outroLines,()=>startPhase(phase+1)),700);return;}
  if(P.outro)say(P.outro);
  later(()=>startPhase(phase+1),P.delay||900);
}
// counter-based progress + fail-safes
function progress(dt,p,P){
  const g=P.goal;
  if(g.type==='endless'){if(pk>=EP.need)nextWave();return;}
  if(g.type==='kill'){
    if(pk>=g.n&&(!g.must||g.must.every(k=>fl.kd&&fl.kd[k]))){completePhase();return;}
    lonely=enemies.some(e=>e.mesh.position.distanceTo(p)<45)?0:lonely+dt;
    if(phaseT>(P.limit||75)||lonely>15){say('システム干渉…残存プログラムを強制消去！');pk=g.n;(g.must||[]).forEach(k=>(fl.kd||(fl.kd={}))[k]=1);completePhase();}
  }else{
    tm-=dt;timerText(g.label);
    (P.cues||[]).forEach(([t,s])=>{if(tm<=t&&!fl['c'+t]){fl['c'+t]=1;say(s);}});
    if(tm<=0)completePhase();
  }
}
function timerText(label){
  const n=Math.max(0,Math.ceil(tm)),f=Math.round(30*(1-tm/tmMax));
  $('timer').textContent=label+' 0:'+String(n).padStart(2,'0')+' '+'█'.repeat(f)+'░'.repeat(30-f);
}

function shoot(){

  wcd[wi]=W.cd;Snd.shot(wi);
  camera.updateWorldMatrix(true,false);
  const dir=new THREE.Vector3();camera.getWorldDirection(dir);
  const right=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0),up=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,1);
  for(let n=0;n<W.pellets;n++){
    const f=W.pellets>1?(n/(W.pellets-1)*2-1):0;       // fan across the pellets
    const d=dir.clone().addScaledVector(right,f*W.fan+rnd(-W.spread,W.spread)).addScaledVector(up,rnd(-W.spread,W.spread)).normalize();
    const m=new THREE.Mesh(bGeo,W.mat);

    m.lookAt(m.position.clone().add(d));scene.add(m);
    bullets.push({mesh:m,dir:d,life:W.life,spd:W.speed,dmg:W.dmg});

  kickZ=W.kick;shake=Math.min(.03,shake+W.shake);flashT=.05;
}

// enemies only spawn inside the area the phase belongs to (gates in between are closed or open, never "behind" a wall)
function spawn(kind,force){
  const P=cur(),W=P.wave||{},Ty=TYPES[kind],c=holder.position,ar=P.area||areaOf(c.z),A=AREAS[ar];
  if(!force&&enemies.length>=(W.cap||10))return;
  const minD=force?18:(W.minD||14);
  if(Ty.stat){                                           // sniper: rooftop of a building in this area, max 4 alive
    if(enemies.filter(e=>e.T.stat).length>=4)return;
    const cv=(COVERS[ar]||[]).filter(b=>b.h>=8&&Math.hypot((b.x0+b.x1)/2-c.x,(b.z0+b.z1)/2-c.z)>minD);
    if(!cv.length)return;
    const b=cv[Math.floor(Math.random()*cv.length)];
    makeEnemy(kind,(b.x0+b.x1)/2,b.h+1.6,(b.z0+b.z1)/2,P,b);return;
  }
  for(let k=0;k<40;k++){                                 // re-roll until clear of every building (AABB)
    const x=rnd(-37,37),z=rnd(A.z0,A.z1),d=Math.hypot(x-c.x,z-c.z);
    if(d<minD||d>52||inBox(x,z,0,Ty.po+.9))continue;
    makeEnemy(kind,x,Ty.y,z,P,null);return;
  }
  if(force){                                             // fallback for bosses: scan the area for any free spot
    for(let z=A.z0;z<=A.z1;z+=4)for(let x=-36;x<=36;x+=4)if(!inBox(x,z,0,Ty.po+.9)){makeEnemy(kind,x,Ty.y,z,P,null);return;}
  }
}

// ---------- smart aim (soft aim assist) ----------
// Picks one enemy near the reticle (inside range, not behind a building) and eases the HOLDER's yaw/pitch toward it.
// The pull is small per frame (~0.09 @60fps), fades out while the player is turning fast, and the pitch uses the same clamp as lookBy().
const AIM_RANGE=48,AIM_R=.34,AIM_K=6;           // range (m), capture radius (1 = half screen height, so .34 = 17% of the screen height), pull rate
const _cp=new THREE.Vector3(),_tp=new THREE.Vector3();
function clearLine(cp,e){                          // sampled line of sight against every building/gate (the target's own roof is ignored)
  const tp=e.mesh.position,dx=tp.x-cp.x,dy=tp.y-cp.y,dz=tp.z-cp.z,n=Math.ceil(Math.hypot(dx,dy,dz)/1.5);
  for(let i=1;i<n;i++){const t=i/n;if(inBox(cp.x+dx*t,cp.z+dz*t,cp.y+dy*t,0,e.box))return false;}
  return true;
}
function updateAim(dt){
  let target=null;
  holder.updateMatrixWorld(true);camera.getWorldPosition(_cp);
  if(settings.aim==='on'){
    const cands=[];
    for(const e of enemies){
      if(e.mesh.position.distanceTo(_cp)>AIM_RANGE)continue;
      _tp.copy(e.mesh.position).project(camera);
      if(_tp.z>1||_tp.z<-1)continue;                                   // behind the camera
      const r=Math.hypot(_tp.x*camera.aspect,_tp.y),cur=e===lockT;     // keep the current lock a bit longer (hysteresis)
      if(r<=AIM_R*(cur?1.35:1))cands.push({e,r:cur?r*.6:r});
    }
    cands.sort((a,b)=>a.r-b.r);
    for(let i=0;i<Math.min(3,cands.length);i++)if(clearLine(_cp,cands[i].e)){target=cands[i].e;break;}
  }
  lockT=target;$('reticle').classList.toggle('lock',!!target);
  // player input has priority: measure how fast the player is turning (mouse or swipe) and fade the assist out
  const speed=inputAcc/Math.max(dt,1e-3);inputAcc=0;lookEma+=(speed-lookEma)*Math.min(1,dt*10);
  if(!target)return;
  const pri=1-Math.max(0,Math.min(1,(lookEma-.4)/1.6));
  if(pri<=.02)return;
  const dir=_tp.copy(target.mesh.position).sub(_cp).normalize();
  const yawT=Math.atan2(-dir.x,-dir.z),pitchT=Math.asin(Math.max(-1,Math.min(1,dir.y)));
  holderEuler.setFromQuaternion(holder.quaternion);
  let dyaw=yawT-holderEuler.y;dyaw=Math.atan2(Math.sin(dyaw),Math.cos(dyaw));   // shortest way round
  const k=(1-Math.exp(-dt*AIM_K))*pri;
  holderEuler.y+=dyaw*k;holderEuler.x+=(pitchT-holderEuler.x)*k;
  holderEuler.x=Math.max(Math.PI/2-controls.maxPolarAngle,Math.min(Math.PI/2-controls.minPolarAngle,holderEuler.x));
  holder.quaternion.setFromEuler(holderEuler);
}

const cf=$('confetti'),cfx=cf.getContext('2d');let cfOn=false,cfP=[],cfRaf=0;
function startConfetti(){                                    // cyan / gold digital confetti on a 2D canvas above everything
  cf.width=innerWidth;cf.height=innerHeight;cfOn=true;
  const cols=['#00f0ff','#ffd400','#00f0ff','#ffd400','#ffffff'];
  cfP=[];for(let i=0;i<190;i++)cfP.push({x:rnd(0,cf.width),y:rnd(-cf.height,0),w:rnd(5,11),h:rnd(8,16),vy:rnd(130,270),vx:rnd(-40,40),rot:rnd(0,6.28),vr:rnd(-6,6),ph:rnd(0,6.28),c:cols[i%cols.length]});
  cancelAnimationFrame(cfRaf);let lt=performance.now();
  const loop=t=>{
    if(!cfOn)return;const d=Math.min(.05,(t-lt)/1000);lt=t;cfx.clearRect(0,0,cf.width,cf.height);
    for(const p of cfP){
      p.y+=p.vy*d;p.ph+=d*3;p.x+=Math.sin(p.ph)*40*d+p.vx*d;p.rot+=p.vr*d;
      if(p.y>cf.height+20){p.y=-20;p.x=rnd(0,cf.width);}
      cfx.save();cfx.translate(p.x,p.y);cfx.rotate(p.rot);cfx.fillStyle=p.c;cfx.globalAlpha=.9;cfx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cfx.restore();
    }
    cfRaf=requestAnimationFrame(loop);
  };
  cfRaf=requestAnimationFrame(loop);
}
function stopFinale(){
  cfOn=false;cancelAnimationFrame(cfRaf);cfx.clearRect(0,0,cf.width,cf.height);
  $('victory').classList.remove('on');parts.forEach(q=>scene.remove(q.mesh));parts=[];
}
function typeSeq(el,lines,ms){                               // type the lines one after another (typewriter)
  el.textContent='';let li=0,acc='';
  const nextLine=()=>{
    if(li>=lines.length)return;
    const base=acc,line=lines[li++];let i=0;
    const id=setInterval(()=>{
      i++;el.textContent=base+line.slice(0,i)+(i<line.length||li<lines.length?'█':'');
      if(i>=line.length){clearInterval(id);acc=base+line+'\n';typeIds.push(setTimeout(nextLine,li===1?600:350));}
    },ms);
    typeIds.push(id);
  };
  nextLine();
}

// ---------- main loop ----------
function tick(now){
  requestAnimationFrame(tick);
  const rdt=Math.min((now-last)/1000,.05);last=now;
  const dt=rdt*(cleared&&!endless?.2:1);T+=dt;      // 0.2x slow motion during the finale
  document.body.classList.toggle('dlgon',!!dlg);
  const fk=env.flick||.5;
  for(const s of signs){s.off-=dt;if(s.off<=0&&Math.random()<dt*fk)s.off=.15+Math.random()*.3;s.m.opacity=s.off>0?(Math.random()<.5?.08:.7):1;}
  if(playing&&phase===0){const rp=resumePhase;resumePhase=0;restoring=!!rp;startPhase(rp||1);restoring=false;}
  if(playing&&endlessPending){
    endlessPending=false;applyEnv(EP);glitch('ENDLESS OVERLOAD');
    event(['クロエ：「まだ終わりじゃないわ。システムが暴走して、敵を無限に吐き出してる！」','クロエ：「限界突破モード！どこまで耐えられるか、見せて！」'],()=>{active=true;phaseT=0;nextWave();});
  }
  if(playing&&!dlg){
    const p=holder.position,sp=10*dt;
    if(!cleared&&!endless)runT+=rdt;
    const dz=v=>Math.abs(v)<.12?0:v;                          // joystick dead zone
    const mvF=Math.max(-1,Math.min(1,(keys.KeyW?1:0)-(keys.KeyS?1:0)-dz(joy.y))),
          mvR=Math.max(-1,Math.min(1,(keys.KeyD?1:0)-(keys.KeyA?1:0)+dz(joy.x))),
          moving=mvF!==0||mvR!==0;
    if(mvF)controls.moveForward(sp*mvF);
    if(mvR)controls.moveRight(sp*mvR);
    pushOut(p,.6);
    // head bobbing
    if(moving){bobT+=dt*9.5;p.y+=(EYE+Math.sin(bobT)*.065-p.y)*Math.min(1,dt*20);}
    else p.y+=(EYE-p.y)*Math.min(1,dt*10);
    {const si=Math.floor((bobT+Math.PI/2)/(2*Math.PI));   // sin(bobT) is at its lowest when si increments = foot touches the ground
     if(si!==lastStep){lastStep=si;if(moving&&!cleared)Snd.playFootstepSound();}}
    // weapon animation: raise on swap, kickback + muzzle flash on fire, screen shake via camera LOCAL position only
    const W=WEAPONS[wi];
    swapT=Math.max(0,swapT-dt);const sw=swapT/.28;
    kickZ*=Math.pow(.001,dt);
    gun.position.y=-.27-.4*sw*sw;gun.position.z=-.6+kickZ;gun.rotation.x=kickZ*W.rise;
    flashT-=dt;models[wi].userData.muz.visible=flashT>0;
    shake*=Math.pow(.00002,dt);camera.position.set(rnd(-1,1)*shake,rnd(-1,1)*shake,0);
    for(let i=0;i<3;i++)wcd[i]=Math.max(0,wcd[i]-dt);
    $('cdfill').style.width=(100*(1-wcd[wi]/W.cd))+'%';
    {                                                         // proximity alert
      let near=false;
      for(const e of enemies)if(e.mesh.position.distanceTo(p)<8+(e.T.keep?e.T.rad*.5:0)){near=true;break;}
      near=near&&!cleared;document.body.classList.toggle('danger',near);
      if(near){alertT-=rdt;if(alertT<=0){Snd.alert();alertT=.6;}}else alertT=0;
    }
    updateAim(dt);
    if(held&&W.auto)shoot();
    for(const g of [gateA,gateB]){                          // gate slide-open animation / idle pulse
      if(g.opening){g.k-=dt/.8;g.mesh.scale.y=Math.max(.001,g.k);if(g.k<=0){g.opening=false;g.mesh.visible=false;}}
      else if(g.mesh.visible)g.mat.opacity=.22+.1*Math.sin(T*3);
    }
    holo.rotation.y+=dt*.6;holo.position.y=14+Math.sin(T*2);
    if(active){
      const P=cur();
      if(waiting&&areaOf(p.z)===P.enter){waiting=false;say('クロエ：「エリアに突入！敵が来るわ！」');}
      if(!waiting)phaseT+=dt;
      if(P.near&&!fl.near&&p.z<P.near.z){fl.near=1;event(P.near.lines);}
      if(P.wave&&!waiting){spawnT-=dt;if(spawnT<=0){spawn(pickKind(P.wave.mix));spawnT=P.wave.interval;}}
      if(!waiting)progress(dt,p,P);
    }
    if(env.blink){
      const on=Math.sin(T*9)>0;
      bMats.forEach(o=>o.m.color.setHex(on?0xff2040:0x4a0010));eMats.forEach(o=>o.m.color.setHex(on?0xff2040:0x600010));
    }
    for(let i=bullets.length-1;i>=0;i--){
      const b=bullets[i],bp=b.mesh.position;
      bp.addScaledVector(b.dir,b.spd*dt);b.life-=dt;
      let dead=b.life<=0||inBox(bp.x,bp.z,bp.y,0);
      if(!dead)for(const e of enemies){
        if(bp.distanceTo(e.mesh.position)<e.T.rad){
          dead=true;e.hp-=b.dmg;
          if(e.T.boss)$('bossfill').style.width=Math.max(0,e.hp/e.max*100)+'%';
          if(e.hp<=0)kill(e);else{burst(bp,0xffffff);Snd.hit();}
          break;
        }
      }
      if(dead){scene.remove(b.mesh);bullets.splice(i,1);}
    }
    for(let i=ebul.length-1;i>=0;i--){
      const b=ebul[i],bp=b.mesh.position;
      bp.addScaledVector(b.dir,26*dt);b.life-=dt;
      let dead=b.life<=0||inBox(bp.x,bp.z,bp.y,0,b.ex);       // b.ex: a sniper's own roof never blocks its shots
      if(!dead&&bp.distanceTo(p)<.9){dead=true;hurt(10);}
      if(dead){scene.remove(b.mesh);ebul.splice(i,1);}
    }
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i],q=e.mesh.position,Ty=e.T;
      if(Ty.stat){e.shoot-=dt;if(e.shoot<=0){e.shoot=Ty.shoot;fire(q,e.box,.03);}e.mesh.rotation.y+=dt*2;continue;}
      const to=new THREE.Vector3(p.x-q.x,0,p.z-q.z);
      q.addScaledVector(to.normalize(),e.speed*dt);pushOut(q,Ty.po);
      if(!(Math.abs(q.x)<60&&q.z<80&&q.z>-150)){scene.remove(e.mesh);enemies.splice(i,1);continue;} // escaped/NaN: drop, spawner refills
      if(Ty.fly)q.y=Ty.y+Math.sin(T*3+e.s)*.5;
      e.mesh.rotation.x+=dt*2;e.mesh.rotation.y+=dt*3;
      if(Ty.keep){
        e.cd-=dt;e.shoot-=dt;
        if(Ty.boss)e.mesh.scale.setScalar(1+Math.sin(T*5)*.05);
        if(Ty.shoot&&e.shoot<=0){e.shoot=Ty.shoot;for(let b=0;b<(Ty.burst||1);b++)fire(q,null,b?.06:0);}
        if(q.distanceTo(p)<Ty.rad+.8&&e.cd<=0){e.cd=1.2;hurt(Ty.dmg);}
      }else if(q.distanceTo(p)<1.5){kill(e,true);hurt(15);}
    }
    for(let i=drops.length-1;i>=0;i--){
      const d=drops[i],dp=d.mesh.position;
      d.t+=dt;d.mesh.rotation.y+=dt*3;d.mesh.rotation.x+=dt*1.5;dp.y=1+Math.sin(d.t*4)*.15;d.mesh.visible=d.t<20||Math.sin(d.t*20)>0;
      if(d.t>25){scene.remove(d.mesh);drops.splice(i,1);}
      else if(Math.hypot(dp.x-p.x,dp.z-p.z)<1.6){
        hp=Math.min(100,hp+20);Snd.heal();updateHUD();scene.remove(d.mesh);drops.splice(i,1);
        const h=$('heal');h.style.opacity=1;setTimeout(()=>h.style.opacity=0,120);
      }
    }
    for(let i=fx.length-1;i>=0;i--){
      const f=fx[i];f.t+=dt;f.mesh.scale.setScalar(1+f.t*8);f.mesh.material.opacity=1-f.t*3;
      if(f.t>.33){scene.remove(f.mesh);fx.splice(i,1);}
    }
  }
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.t+=dt;q.v.y-=9*dt;q.mesh.position.addScaledVector(q.v,dt);q.mesh.scale.setScalar(Math.max(.01,1-q.t/q.life));if(q.t>=q.life){scene.remove(q.mesh);parts.splice(i,1);}}
  renderer.render(scene,camera);
}
initTerm();refreshButtons('COMMAND');if(loadSave())$('btn').textContent='START NEW GAME';
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
reset();
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
